name: Linux

on:
  push:
    branches:
      - "mr-main"
  pull_request:

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_FORCE_SYSTEM_BINARIES: 1
  CMAKE_BUILD_TYPE: "Release"
  DEBIAN_FRONTEND: "noninteractive"

jobs:
  x86_64-matrix:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - distro: debian
            version: 12
          - distro: debian
            version: 13
          - distro: ubuntu
            version: 22.04
          - distro: ubuntu
            version: 24.04
    container:
      image: ${{ matrix.distro }}:${{ matrix.version }}
    steps:
      - name: get-cmake
        uses: lukka/get-cmake@v3.28.1

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install git
        run: |
          apt-get update -y
          apt-get install -y git

      - uses: actions/checkout@v2
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Git config safe directory
        shell: bash
        run: bash ./scripts/${{ matrix.distro }}-${{ matrix.version }}/1.5-git-safe.sh

      - name: Install Dependencies
        run: bash ./scripts/${{ matrix.distro }}-${{ matrix.version }}/1-install-deps.sh

      - name: Create Build Environment
        run: bash ./scripts/${{ matrix.distro }}-${{ matrix.version }}/2-configure.sh '-DCMAKE_TOOLCHAIN_FILE=./vcpkg/scripts/buildsystems/vcpkg.cmake'

      - name: Build Server
        run: bash ./scripts/${{ matrix.distro }}-${{ matrix.version }}/3-build.sh

      - name: Archive server artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeamMP-Server.${{ matrix.distro }}.${{ matrix.version }}.x86_64
          path: ./bin/BeamMP-Server

      - name: Archive server debug info artifact
        uses: actions/upload-artifact@v4
        with:
          name: debuginfo.${{ matrix.distro }}.${{ matrix.version }}.x86_64
          path: ./bin/BeamMP-Server.debug

      - name: Build Tests
        run: bash ./scripts/${{ matrix.distro }}-${{ matrix.version }}/3-build-tests.sh

      - name: Install Runtime Dependencies
        run: bash ./scripts/${{ matrix.distro }}-${{ matrix.version }}/4-install-runtime-deps.sh

      - name: Test
        run: ./bin/BeamMP-Server-tests

      - name: MR integration tests (server without backend)
        shell: bash
        run: |
          set -uo pipefail
          apt-get install -y python3

          # Los hosts del backend de BeamMP apuntan a loopback (nada escucha
          # en 443): si el server intentara contactarlos, fallaria al instante.
          if printf '%s\n' '127.0.0.1 backend.beammp.com auth.beammp.com backup1.beammp.com backup2.beammp.com keymaster.beammp.com check.beammp.com beammp.com' >> /etc/hosts; then
            echo "Backend hosts blocked via /etc/hosts"
          else
            echo "::warning::could not edit /etc/hosts, backend hosts are NOT blocked in this run"
          fi

          BIN="$PWD/bin/BeamMP-Server"
          WORK="$(mktemp -d)"
          cp test/mr/ServerConfig.ci.toml "$WORK/ServerConfig.toml"
          # plugin Lua solo de CI (evento onPlayerTransport); no se entrega con el binario
          mkdir -p "$WORK/Resources/Server/MrCiTransport"
          cp test/mr/ci_plugin/main.lua "$WORK/Resources/Server/MrCiTransport/main.lua"
          # stdin abierto (lectura/escritura) para que la consola del server no vea EOF
          mkfifo "$WORK/stdin"
          exec 3<>"$WORK/stdin"
          (cd "$WORK" && exec "$BIN" <&3 >"$WORK/server.log" 2>&1) &
          SERVER_PID=$!

          for _ in $(seq 1 100); do
            grep -q "ALL SYSTEMS STARTED SUCCESSFULLY" "$WORK/server.log" && break
            kill -0 "$SERVER_PID" 2>/dev/null || break
            sleep 0.25
          done

          # GitHub corre bash con -e: `|| VAR=$?` evita que un fallo aborte el paso
          # antes de volcar el log del server.
          RC=0
          RC_HANDSHAKE=0
          MR_SERVER_BIN="$BIN" MR_SERVER_LOG="$WORK/server.log" MR_SERVER_PORT=30899 MR_SERVER_PID="$SERVER_PID" \
            python3 test/mr/test_nobackend.py -v || RC=$?

          # Misma instancia del server: cada prueba usa su propio nombre de piloto y cierra sus sockets.
          MR_SERVER_PORT=30899 python3 test/mr/test_handshake.py -v || RC_HANDSHAKE=$?
          if [ "$RC" -eq 0 ]; then RC=$RC_HANDSHAKE; fi

          RC_TRANSPORT=0
          MR_SERVER_LOG="$WORK/server.log" MR_SERVER_PID="$SERVER_PID" MR_SERVER_PORT=30899 python3 test/mr/test_transport.py -v || RC_TRANSPORT=$?
          if [ "$RC" -eq 0 ]; then RC=$RC_TRANSPORT; fi

          kill -INT "$SERVER_PID" 2>/dev/null
          for _ in $(seq 1 40); do
            kill -0 "$SERVER_PID" 2>/dev/null || break
            sleep 0.25
          done
          if kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "::warning::server did not exit within 10s after SIGINT, killing"
            kill -KILL "$SERVER_PID" 2>/dev/null
          else
            echo "Server exited cleanly after SIGINT"
          fi

          if [ "$RC" -ne 0 ]; then
            echo "===== server log ====="
            cat "$WORK/server.log"
          fi
          exit "$RC"

  arm64-matrix:
    runs-on: ubuntu-22.04-arm
    env:
      VCPKG_DEFAULT_TRIPLET: "arm64-linux"
    strategy:
      matrix:
        include:
          - distro: debian
            version: 12
          - distro: debian
            version: 13
          - distro: ubuntu
            version: 22.04
          - distro: ubuntu
            version: 24.04
    container:
      image: ${{ matrix.distro }}:${{ matrix.version }}
    steps:
      - name: get-cmake
        uses: lukka/get-cmake@v3.28.1

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install git
        run: |
          apt-get update -y
          apt-get install -y git

      - uses: actions/checkout@v2
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Git config safe directory
        shell: bash
        run: bash ./scripts/${{ matrix.distro }}-${{ matrix.version }}/1.5-git-safe.sh

      - name: Install Dependencies
        run: bash ./scripts/${{ matrix.distro }}-${{ matrix.version }}/1-install-deps.sh

      - name: Create Build Environment
        run: bash ./scripts/${{ matrix.distro }}-${{ matrix.version }}/2-configure.sh '-DCMAKE_TOOLCHAIN_FILE=./vcpkg/scripts/buildsystems/vcpkg.cmake'

      - name: Build Server
        run: bash ./scripts/${{ matrix.distro }}-${{ matrix.version }}/3-build.sh

      - name: Archive server artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeamMP-Server.${{ matrix.distro }}.${{ matrix.version }}.arm64
          path: ./bin/BeamMP-Server

      - name: Archive server debug info artifact
        uses: actions/upload-artifact@v4
        with:
          name: debuginfo.${{ matrix.distro }}.${{ matrix.version }}.arm64
          path: ./bin/BeamMP-Server.debug

      - name: Build Tests
        run: bash ./scripts/${{ matrix.distro }}-${{ matrix.version }}/3-build-tests.sh

      - name: Install Runtime Dependencies
        run: bash ./scripts/${{ matrix.distro }}-${{ matrix.version }}/4-install-runtime-deps.sh

      - name: Test
        run: ./bin/BeamMP-Server-tests
